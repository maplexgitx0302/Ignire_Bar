<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="火與焰徽記：口銜燃燒植物的彩虹鳥">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D58A"/>
      <stop offset=".5" stop-color="#C9952F"/>
      <stop offset="1" stop-color="#8C6216"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#C2410C"/>
      <stop offset=".6" stop-color="#F97316"/>
      <stop offset="1" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="soot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2420"/>
      <stop offset="1" stop-color="#0B0908"/>
    </linearGradient>
    <clipPath id="tail">
      <path d="M78 74 L112 96 L106 103 L101 99 L102 108 L94 106 L92 112 L72 84 Z"/>
    </clipPath>
  </defs>
  <!-- Seal -->
  <circle cx="60" cy="60" r="57" fill="#14100D"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="60" cy="60" r="49" fill="none" stroke="url(#gold)" stroke-width=".8" opacity=".6"/>
  <clipPath id="seal"><circle cx="60" cy="60" r="48"/></clipPath>
  <g clip-path="url(#seal)">
  <g transform="translate(17 15) scale(.76)">
  <!-- Tail: soot-black feathers whose tips keep the seven colours -->
  <g clip-path="url(#tail)">
    <rect x="70" y="70" width="50" height="45" fill="url(#soot)"/>
    <g transform="rotate(34 104 101)">
      <rect x="86" y="96" width="40" height="2" fill="#E53935"/>
      <rect x="86" y="98" width="40" height="2" fill="#FB8C00"/>
      <rect x="86" y="100" width="40" height="2" fill="#FDD835"/>
      <rect x="86" y="102" width="40" height="2" fill="#43A047"/>
      <rect x="86" y="104" width="40" height="2" fill="#1E88E5"/>
      <rect x="86" y="106" width="40" height="2" fill="#3949AB"/>
      <rect x="86" y="108" width="40" height="8" fill="#8E24AA"/>
    </g>
  </g>
  <path fill="none" stroke="url(#gold)" stroke-width="1.2" stroke-linejoin="round"
        d="M78 74 L112 96 L106 103 L101 99 L102 108 L94 106 L92 112 L72 84"/>
  <!-- Body -->
  <path fill="url(#soot)" stroke="url(#gold)" stroke-width="1.4"
        d="M38 46 C44 40 58 41 68 48 C77 55 83 64 86 76 C76 83 62 83 52 77 C42 71 36 59 38 46 Z"/>
  <!-- Wing -->
  <path fill="#211B17" stroke="url(#gold)" stroke-width="1"
        d="M50 52 C62 51 74 60 84 76 C72 80 60 76 53 69 C49 64 48 57 50 52 Z"/>
  <path fill="none" stroke="#C9952F" stroke-width=".8" opacity=".75" d="M56 59 C64 62 71 67 77 74 M55 65 C61 69 67 72 73 76"/>
  <!-- Head and heavy crow beak -->
  <circle cx="43" cy="40" r="10" fill="url(#soot)" stroke="url(#gold)" stroke-width="1.4"/>
  <path fill="url(#gold)" d="M35 35 C29 35 22 37 16 41 C22 42 29 44 35 45 Z"/>
  <circle cx="44" cy="37.5" r="1.9" fill="#F3D58A"/>
  <!-- Burning sprig held in the beak -->
  <path fill="none" stroke="#7A5420" stroke-width="1.8" stroke-linecap="round" d="M22 41 C20 35 19 28 20 21"/>
  <path fill="#56763A" d="M20.5 31 C16 30 14 27 14 25 C17 25 20 27 20.5 31 Z M20 27 C24 25 26 22 26 20 C23 21 20.5 23 20 27 Z"/>
  <path fill="url(#flame)" d="M20 22 C15 18 16 12 20 5 C21 9 25 12 24 17 C23.5 20 22 21.5 20 22 Z"/>
  <path fill="#FDE68A" d="M20.3 20.5 C18.5 18.5 19 15.5 20.5 12.5 C21 15 22.5 16.5 22 18.5 C21.7 19.7 21 20.3 20.3 20.5 Z"/>
  <!-- Legs -->
  <path fill="none" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round" d="M56 80 L54 94 M64 81 L65 94 M50 94 L58 94 M61 94 L69 94"/>
  </g>
  </g>
</svg>
